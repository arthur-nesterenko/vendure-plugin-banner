name: Code Quality

concurrency:
    group: code-quality-${{ github.head_ref }}
    cancel-in-progress: true

on:
    pull_request:
        branches:
            - main

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Install sharp for Linux
              run: npm install --os=linux --cpu=x64 sharp

            - name: Run Prettier
              run: npm run prettify -- --check

            - name: Run ESLint
              run: npm run lint

            - name: Run TypeScript type check
              run: npx tsc --noEmit

            - name: Run E2E tests
              run: npm run e2e
